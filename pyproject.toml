[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "svg2gifpy"
version = "0.1.0"
authors = [
    { name = "Ishan Dutta", email="ishandutta2007@gmail.com" },
]
description = "A CLI tool to convert animated SVG files into optimized animated GIFs using Playwright and Pillow."
readme = "README.md"
license = "MIT"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "Pillow>=9.0.0",
    "playwright>=1.20.0",
]

[project.urls]
Homepage = "https://github.com/ishandutta2007/svg2gif"
Repository = "https://github.com/ishandutta2007/svg2gif"
Documentation = "https://github.com/ishandutta2007/svg2gif#readme"
Issues = "https://github.com/ishandutta2007/svg2gif/issues"

[project.scripts]
svg2gif = "svg2gif:main"
svg2gifpy = "svg2gif:main"

[tool.setuptools]
py-modules = ["svg2gif", "svg2gifpy", "cli_interactive"]

