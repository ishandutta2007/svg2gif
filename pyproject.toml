[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "svg2gif"
version = "0.1.0"
authors = [
    { name="Ishan Dutta" }
]
description = "A CLI tool to convert animated SVG files into optimized animated GIFs using Playwright and Pillow."
readline-type = "text/markdown"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "Pillow>=9.0.0",
    "playwright>=1.20.0",
]

[project.urls]
Homepage = "https://github.com/ishandutta2007/svg2gif"
Repository = "https://github.com/ishandutta2007/svg2gif"

[project.scripts]
svg2gif = "svg2gif:main"
