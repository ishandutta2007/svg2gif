<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#111827"/></linearGradient><linearGradient id="border-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="title-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="35%" stop-color="#818cf8"/><stop offset="70%" stop-color="#c084fc"/><stop offset="100%" stop-color="#f472b6"/></linearGradient><linearGradient id="badge-blue" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#0284c7" stop-opacity=".3"/><stop offset="100%" stop-color="#0369a1" stop-opacity=".1"/></linearGradient><linearGradient id="badge-purple" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#9333ea" stop-opacity=".3"/><stop offset="100%" stop-color="#7e22ce" stop-opacity=".1"/></linearGradient><linearGradient id="badge-green" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#059669" stop-opacity=".3"/><stop offset="100%" stop-color="#047857" stop-opacity=".1"/></linearGradient><filter id="glow-heavy" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="16"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="glow-subtle" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlowA{0%{opacity:.18;transform:scale(1) translate(0,0)}50%{opacity:.38;transform:scale(1.15) translate(15px,-10px)}}@keyframes pulseGlowB{0%{opacity:.15;transform:scale(1) translate(0,0)}50%{opacity:.35;transform:scale(1.12) translate(-20px,12px)}}@keyframes floatParticle{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-10px) rotate(4deg)}}@keyframes floatParticleRev{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(10px) rotate(-4deg)}}@keyframes dashCycle{0%{stroke-dashoffset:120}}@keyframes arrowShift{0%{transform:translateX(0);opacity:.7}50%{transform:translateX(6px);opacity:1}}.glow-orb-1{animation:pulseGlowA 4s ease-in-out infinite;transform-origin:220px 180px}.glow-orb-2{animation:pulseGlowB 5s ease-in-out infinite;transform-origin:980px 180px}.floating-badge-left,.floating-badge-right{animation:floatParticle 3.5s ease-in-out infinite;transform-origin:center}.floating-badge-right{animation:floatParticleRev 4s ease-in-out infinite}.animated-wire{stroke-dasharray:10 14;animation:dashCycle 2.5s linear infinite}.animated-arrow{animation:arrowShift 2s ease-in-out infinite}</style><rect width="1196" height="356" x="2" y="2" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2" rx="20"/><rect width="1196" height="356" x="2" y="2" fill="none" stroke="url(#border-grad)" stroke-width="1.5" opacity=".35" rx="20"/><g stroke="#334155" stroke-width="1" opacity=".12"><path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200"/><path d="M120 0 V360 M240 0 V360 M360 0 V360 M480 0 V360 M600 0 V360 M720 0 V360 M840 0 V360 M960 0 V360 M1080 0 V360"/></g><circle cx="220" cy="180" r="150" fill="#0284c7" class="glow-orb-1" filter="url(#glow-heavy)"/><circle cx="980" cy="180" r="150" fill="#a855f7" class="glow-orb-2" filter="url(#glow-heavy)"/><circle cx="600" cy="90" r="90" fill="#38bdf8" filter="url(#glow-heavy)" opacity=".1"/><path stroke="#38bdf8" stroke-width="2" d="M 40 180 L 170 180" class="animated-wire" opacity=".5"/><path stroke="#ec4899" stroke-width="2" d="M 1030 180 L 1160 180" class="animated-wire" opacity=".5"/><g class="floating-badge-left" transform="translate(60, 115)"><rect width="125" height="115" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity=".85" rx="14"/><rect width="125" height="115" fill="url(#badge-blue)" rx="14"/><text x="62" y="44" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="bold" text-anchor="middle">SVG</text><rect width="80" height="4" x="22" y="58" fill="#38bdf8" opacity=".4" rx="2"/><rect width="60" height="4" x="32" y="68" fill="#38bdf8" opacity=".3" rx="2"/><text x="62" y="98" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" text-anchor="middle">&lt;vector/&gt;</text></g><g class="animated-arrow"><path stroke="#818cf8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M 0 0 L 22 0 M 15 -6 L 22 0 L 15 6" transform="translate(200, 168)"/></g><g class="animated-arrow"><path stroke="#c084fc" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M 0 0 L 22 0 M 15 -6 L 22 0 L 15 6" transform="translate(970, 168)"/></g><g class="floating-badge-right" transform="translate(1015, 115)"><rect width="125" height="115" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" opacity=".85" rx="14"/><rect width="125" height="115" fill="url(#badge-purple)" rx="14"/><text x="62" y="44" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="bold" text-anchor="middle">GIF</text><rect width="80" height="4" x="22" y="58" fill="#c084fc" opacity=".4" rx="2"/><rect width="60" height="4" x="32" y="68" fill="#c084fc" opacity=".3" rx="2"/><text x="62" y="98" fill="#e9d5ff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" text-anchor="middle">[frames: 256c]</text></g><g id="foreground-content" text-anchor="middle" style="pointer-events:none"><rect width="210" height="26" x="495" y="36" fill="#1e293b" stroke="#334155" stroke-width="1" rx="13"/><text x="600" y="53" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">HIGH PERFORMANCE TOOL</text><text x="600" y="142" fill="url(#title-grad)" filter="url(#glow-subtle)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">svg2gifpy</text><text x="600" y="194" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" letter-spacing=".3">Convert Animated SVG Files into Optimized, Looping Animated GIFs</text><g><g transform="translate(295, 235) translate(0, 0)"><rect width="180" height="34" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" rx="17"/><rect width="180" height="34" fill="url(#badge-blue)" rx="17"/><text x="90" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🎭 Headless Chromium</text></g><g transform="translate(295, 235) translate(195, 0)"><rect width="215" height="34" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" rx="17"/><rect width="215" height="34" fill="url(#badge-purple)" rx="17"/><text x="107" y="22" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🎯 Max Size Target (-s)</text></g><g transform="translate(295, 235) translate(425, 0)"><rect width="185" height="34" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="17"/><rect width="185" height="34" fill="url(#badge-green)" rx="17"/><text x="92" y="22" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ Adaptive 256 Palette</text></g></g><text x="600" y="316" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">$ pip install svg2gifpy &amp;&amp; svg2gif -i input.svg -o output.gif -s 1.2</text></g></svg>