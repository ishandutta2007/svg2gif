<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="badge-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="badge-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="badge-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow-heavy" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Keyframe Animations */
    @keyframes pulseGlowA {
      0%, 100% { opacity: 0.18; transform: scale(1) translate(0, 0); }
      50% { opacity: 0.38; transform: scale(1.15) translate(15px, -10px); }
    }
    @keyframes pulseGlowB {
      0%, 100% { opacity: 0.15; transform: scale(1) translate(0, 0); }
      50% { opacity: 0.35; transform: scale(1.12) translate(-20px, 12px); }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(4deg); }
    }
    @keyframes floatParticleRev {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(10px) rotate(-4deg); }
    }
    @keyframes dashCycle {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes arrowShift {
      0%, 100% { transform: translateX(0); opacity: 0.7; }
      50% { transform: translateX(6px); opacity: 1; }
    }

    /* Animation Classes */
    .glow-orb-1 { animation: pulseGlowA 4s ease-in-out infinite; transform-origin: 220px 180px; }
    .glow-orb-2 { animation: pulseGlowB 5s ease-in-out infinite; transform-origin: 980px 180px; }
    .floating-badge-left { animation: floatParticle 3.5s ease-in-out infinite; transform-origin: center; }
    .floating-badge-right { animation: floatParticleRev 4s ease-in-out infinite; transform-origin: center; }
    .animated-wire { stroke-dasharray: 10 14; animation: dashCycle 2.5s linear infinite; }
    .animated-arrow { animation: arrowShift 2s ease-in-out infinite; }
  </style>

  <!-- ================= BACKGROUND LAYER ================= -->
  <!-- Card Base with rounded border -->
  <rect width="1196" height="356" x="2" y="2" rx="20" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2"/>
  <rect width="1196" height="356" x="2" y="2" rx="20" fill="none" stroke="url(#border-grad)" stroke-width="1.5" opacity="0.35"/>

  <!-- Background Decorative Tech Grid -->
  <g stroke="#334155" stroke-width="1" opacity="0.12">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200" />
    <path d="M120 0 V360 M240 0 V360 M360 0 V360 M480 0 V360 M600 0 V360 M720 0 V360 M840 0 V360 M960 0 V360 M1080 0 V360" />
  </g>

  <!-- ================= DYNAMIC BACKGROUND ELEMENTS ================= -->
  <!-- Atmospheric Glow Orbs (Strictly behind all text) -->
  <circle cx="220" cy="180" r="150" fill="#0284c7" filter="url(#glow-heavy)" class="glow-orb-1"/>
  <circle cx="980" cy="180" r="150" fill="#a855f7" filter="url(#glow-heavy)" class="glow-orb-2"/>
  <circle cx="600" cy="90" r="90" fill="#38bdf8" filter="url(#glow-heavy)" opacity="0.1"/>

  <!-- Dynamic Wires -->
  <path d="M 40 180 L 170 180" stroke="#38bdf8" stroke-width="2" opacity="0.5" class="animated-wire"/>
  <path d="M 1030 180 L 1160 180" stroke="#ec4899" stroke-width="2" opacity="0.5" class="animated-wire"/>

  <!-- Dynamic SVG Icon Container (Left) -->
  <g class="floating-badge-left" transform="translate(60, 115)">
    <rect width="125" height="115" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.85"/>
    <rect width="125" height="115" rx="14" fill="url(#badge-blue)"/>
    <text x="62" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="bold" fill="#38bdf8" text-anchor="middle">SVG</text>
    <rect x="22" y="58" width="80" height="4" rx="2" fill="#38bdf8" opacity="0.4"/>
    <rect x="32" y="68" width="60" height="4" rx="2" fill="#38bdf8" opacity="0.3"/>
    <text x="62" y="98" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#7dd3fc" text-anchor="middle">&lt;vector/&gt;</text>
  </g>

  <!-- Directional Arrow (Left to Center) -->
  <g transform="translate(200, 168)" class="animated-arrow">
    <path d="M 0 0 L 22 0 M 15 -6 L 22 0 L 15 6" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Directional Arrow (Center to Right) -->
  <g transform="translate(970, 168)" class="animated-arrow">
    <path d="M 0 0 L 22 0 M 15 -6 L 22 0 L 15 6" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Dynamic GIF Icon Container (Right) -->
  <g class="floating-badge-right" transform="translate(1015, 115)">
    <rect width="125" height="115" rx="14" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" opacity="0.85"/>
    <rect width="125" height="115" rx="14" fill="url(#badge-purple)"/>
    <text x="62" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="bold" fill="#c084fc" text-anchor="middle">GIF</text>
    <rect x="22" y="58" width="80" height="4" rx="2" fill="#c084fc" opacity="0.4"/>
    <rect x="32" y="68" width="60" height="4" rx="2" fill="#c084fc" opacity="0.3"/>
    <text x="62" y="98" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#e9d5ff" text-anchor="middle">[frames: 256c]</text>
  </g>

  <!-- ================= FOREGROUND LAYER (TITLE & SUBTITLE) ================= -->
  <!-- Guaranteed foreground layer: permanently above all animations and decorative elements -->
  <g text-anchor="middle" id="foreground-content" style="pointer-events: none;">
    <!-- Top Pill Tag -->
    <rect x="495" y="36" width="210" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="600" y="53" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.5">
      HIGH PERFORMANCE TOOL
    </text>

    <!-- Main Title -->
    <text x="600" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="url(#title-grad)" filter="url(#glow-subtle)" letter-spacing="-1">
      svg2gifpy
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="600" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" letter-spacing="0.3">
      Convert Animated SVG Files into Optimized, Looping Animated GIFs
    </text>

    <!-- Feature Pills Row -->
    <g transform="translate(295, 235)">
      <!-- Badge 1: Playwright -->
      <g transform="translate(0, 0)">
        <rect width="180" height="34" rx="17" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
        <rect width="180" height="34" rx="17" fill="url(#badge-blue)"/>
        <text x="90" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">
          🎭 Headless Chromium
        </text>
      </g>

      <!-- Badge 2: Max File Size -->
      <g transform="translate(195, 0)">
        <rect width="215" height="34" rx="17" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
        <rect width="215" height="34" rx="17" fill="url(#badge-purple)"/>
        <text x="107" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#c084fc">
          🎯 Max Size Target (-s)
        </text>
      </g>

      <!-- Badge 3: Pillow Quantization -->
      <g transform="translate(425, 0)">
        <rect width="185" height="34" rx="17" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
        <rect width="185" height="34" rx="17" fill="url(#badge-green)"/>
        <text x="92" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#34d399">
          ⚡ Adaptive 256 Palette
        </text>
      </g>
    </g>

    <!-- Bottom CLI Quick Reference -->
    <text x="600" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" fill="#64748b">
      $ pip install svg2gifpy &amp;&amp; svg2gif -i input.svg -o output.gif -s 1.2
    </text>
  </g>
</svg>
