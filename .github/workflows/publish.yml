name: Publish to PyPI

on:
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  check-and-publish:
    name: Check Version & Auto-Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/svg2gifpy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract package name and version from pyproject.toml
        id: pkg_info
        run: |
          INFO=$(python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              data = tomllib.load(f)
          print(f\"{data['project']['name']}|{data['project']['version']}\")
          ")
          PKG_NAME=$(echo "$INFO" | cut -d'|' -f1)
          VERSION=$(echo "$INFO" | cut -d'|' -f2)
          echo "pkg_name=$PKG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Package: $PKG_NAME, Version: $VERSION"

      - name: Check if version is already published on PyPI
        id: pypi_check
        run: |
          PKG_NAME="${{ steps.pkg_info.outputs.pkg_name }}"
          VERSION="${{ steps.pkg_info.outputs.version }}"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/${PKG_NAME}/${VERSION}/json")
          echo "PyPI check for ${PKG_NAME}==${VERSION} returned HTTP ${HTTP_STATUS}"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Version ${VERSION} already exists on PyPI. Skipping publication."
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "Version ${VERSION} is new! Proceeding to test, build, and publish."
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

      - name: Install build and test dependencies
        if: steps.pypi_check.outputs.should_publish == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install build Pillow playwright
          playwright install --with-deps chromium

      - name: Run test suite
        if: steps.pypi_check.outputs.should_publish == 'true'
        run: |
          python -m unittest test_svg2gif.py

      - name: Build sdist and wheel distributions
        if: steps.pypi_check.outputs.should_publish == 'true'
        run: |
          python -m build

      - name: Publish package to PyPI
        if: steps.pypi_check.outputs.should_publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Supports both PyPI Trusted Publishing (OIDC) and API token secret (PYPI_API_TOKEN)
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Create Git Tag and GitHub Release
        if: steps.pypi_check.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.pkg_info.outputs.version }}"
          name: "v${{ steps.pkg_info.outputs.version }}"
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
